#Color Customization
#highlight: "#54bfff"
#white: "#FF0000"
#black: "#000"

#Image Customization
# Kapak gorseli. w= genislik, fm=webp modern format, q= kalite.
# 1600px yerine 1280px + WebP: gorsel ~275 KB'dan ~90 KB'a iniyor.
# NOT: Bu bir stok fotograf. Kendi islerinden birinin fotografini koyman
# hem daha inandirici olur hem de bu dis baglantiyi ortadan kaldirir.
# Kapak gorseli iki boyutta: mobilde kucuk olan iniyor.
# Mobilde 187 KB'lik 1280px gorseli 360px'lik ekrana indirmek gereksizdi.
# NOT: Bu bir stok fotograf. Kendi islerinden birinin fotografini koyman
# hem daha inandirici olur hem de bu dis baglantiyi ortadan kaldirir.
header-image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1600&q=72&fm=webp&auto=format&fit=crop"
header-image-mobil: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=760&q=60&fm=webp&auto=format&fit=crop"
contact-image: "../img/contact.png"
#Font Awesome icon for portfolio grid when an item is hovered over
#portfolio-icon: fas fa-expand-arrows-alt fa-3x #default: fas fa-plus fa-3x

# Add custom fonts
# Dort yazi tipi tek istekte cekiliyor (| ayraci) ve display=swap sayesinde
# font inene kadar metin gorunmez kalmiyor. Ayri ayri istemek 4 kat gecikme demekti.
fonts_urls:
    # Roboto Slab cikarildi: body-font mixin'inde yorum satirinda, hic kullanilmiyor.
    # Droid Serif yalnizca normal ve italik olarak kullaniliyor, kalin varyantlari cikarildi.
    - "https://fonts.googleapis.com/css?family=Montserrat:400,700|Kaushan+Script|Droid+Serif:400,400italic&display=swap"

# Set custom fonts
fonts:
  - name: "Montserrat"
    for: "heading"
  - name: "Kaushan Script"
    for: "script"
  - name: "Droid Serif"
    for: "serif"
  - name: "Roboto Slab"
    for: "body"
