---
layout: default
---
{% include nav.html %}

<section class="bg-light page-section portfolio-grid" id="islerim" style="padding-top: 140px;">
  <div class="container">

    <nav aria-label="breadcrumb">
      <ol class="breadcrumb" style="background: transparent; padding-left: 0;">
        <li class="breadcrumb-item"><a href="{{ '/' | relative_url }}">Ana Sayfa</a></li>
        <li class="breadcrumb-item active" aria-current="page">İşlerimiz</li>
      </ol>
    </nav>

    <div class="row">
      <div class="col-lg-12 text-center">
        <h1 class="section-heading text-uppercase">{{ page.title }}</h1>
        <p class="section-subheading text-muted">{{ page.tagline }}</p>
      </div>
    </div>

    <div class="row">
      {% assign projects = site.portfolio | sort: "date" | reverse %}
      {% for project in projects %}
      <div class="col-md-4 col-sm-6 portfolio-item">
        <a class="portfolio-link" href="{{ project.url | relative_url }}">
          <div class="portfolio-hover">
            <div class="portfolio-hover-content">
              <i class="{{ site.data.style.portfolio-icon | default: 'fas fa-plus fa-3x' }}"></i>
            </div>
          </div>
          <img class="img-fluid" src="{{ project.caption.thumbnail }}" alt="{{ project.caption.title }}" loading="lazy">
        </a>
        <div class="portfolio-caption">
          <h4><a href="{{ project.url | relative_url }}" style="color: inherit;">{{ project.caption.title }}</a></h4>
          <p class="text-muted">{{ project.caption.subtitle }}</p>
        </div>
      </div>
      {% endfor %}
    </div>

    {{ content }}

  </div>
</section>
