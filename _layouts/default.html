<!DOCTYPE html>
<html lang="{{ site.locale | slice: 0,2 | default: "tr" }}">

  {% include head.html %}

  <body id="sayfa-basi">

      <main id="ana-icerik">{{ content }}</main>

	  {% include footer.html %}
	  {% include whatsapp.html %}

	  <!-- Bootstrap core JavaScript -->
	  <script defer src="{{ '/assets/js/jquery.min.js' | relative_url }}"></script>
	  <script defer src="{{ '/assets/js/bootstrap.bundle.min.js' | relative_url }}"></script>

	  <!-- Plugin JavaScript -->
	  <script defer src="{{ '/assets/js/jquery.easing.min.js' | relative_url }}"></script>

	  <!-- Contact form JavaScript -->
	  <script defer src="{{ '/assets/js/jqBootstrapValidation.js' | relative_url }}"></script>
	  <script defer src="{{ '/assets/js/contact_me.js' | relative_url }}"></script>

	  <!-- Custom scripts for this template -->
	  <script defer src="{{ '/assets/js/agency.min.js' | relative_url }}"></script>

	  <!-- /#iletisim gibi bir adresle gelindiginde ilgili bolume goturur.
	       - Sondaki egik cizgiyi temizler: /#iletisim/ da calisir
	       - Sayfa tam yuklendikten sonra tekrar konumlanir; gorseller
	         yerine oturdugunda kayma olmaz
	       - Sonra adres cubugundaki isareti temizler, takili kalmasin -->
	  <script>
	    (function () {
	      var isaret = window.location.hash;
	      if (!isaret) return;

	      var kimlik = isaret.replace(/^#/, "").replace(/\/+$/, "");
	      if (!kimlik) return;

	      function konumlan() {
	        var hedef = document.getElementById(kimlik);
	        if (hedef) {
	          hedef.scrollIntoView();
	        }
	        if (window.history.replaceState) {
	          window.history.replaceState(
	            null,
	            document.title,
	            window.location.pathname + window.location.search
	          );
	        }
	      }

	      window.addEventListener("load", function () {
	        setTimeout(konumlan, 300);
	      });
	    })();
	  </script>

	  <!-- Scrollspy, menude hangi bolumun sari olacagini belirler.
	       Temanin varsayilan degeri 56; bu deger temanin kendi -54'luk yumusak
	       kaydirmasiyla uyumlu ama bizim scroll-margin-top: 80px degerimizle
	       degil. Aradaki 24px fark yuzunden bir bolume inildiginde scrollspy
	       hala onceki bolumde sanip yanlis menuyu isaretliyordu.
	       90 her iki kaydirma bicimiyle de dogru calisiyor. -->
	  <script>
	    // defer edilen jQuery henuz yuklenmemis olabilir; load olayini bekle.
	    window.addEventListener("load", function () {
	      if (!window.jQuery) return;
	      var govde = window.jQuery("body");
	      if (!govde.data("bs.scrollspy")) return;
	      govde.scrollspy("dispose");
	      govde.scrollspy({ target: "#mainNav", offset: 90 });
	    });
	  </script>

	  <!-- Logoya tiklayinca sayfa basina donme.
	       Temanin yumusak kaydirma kodu her hedef icin "hedefin ustu - 54px"
	       hesabi yapiyor; menu cubugunun altinda kalmasin diye. Bolum
	       baglantilarinda dogru ama logonun hedefi <body>, yani offset zaten 0.
	       0 - 54 = -54 cikiyor; Chrome bunu tasma (overscroll) olarak gosterip
	       ustte beyaz serit birakiyordu.

	       DIKKAT: jQuery dinleyiciyi sinifa degil dogrudan elemana bagliyor.
	       Sinifi kaldirmak bagi koparmiyor, iki kod birden calisiyordu. Bu
	       yuzden olayi document uzerinde YAKALAMA (capture) asamasinda
	       kesiyoruz; boylece elemana hic ulasmadan durduruluyor ve temanin
	       kodu hic calismiyor. jQuery'nin yuklenmis olmasi da gerekmiyor. -->
	  <script>
	    document.addEventListener(
	      "click",
	      function (e) {
	        var logo = e.target.closest
	          ? e.target.closest('.navbar-brand[href="#sayfa-basi"]')
	          : null;
	        if (!logo) return;
	        e.preventDefault();
	        e.stopPropagation();
	        window.scrollTo({ top: 0, behavior: "smooth" });
	        // acik mobil menuyu kapat (temanin kodu artik calismadigi icin)
	        var menu = document.querySelector(".navbar-collapse.show");
	        if (menu && window.jQuery) window.jQuery(menu).collapse("hide");
	      },
	      true
	    );
	  </script>

  </body>
</html>
