# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.
# This file is *NOT* reloaded automatically when you use 'bundle exec jekyll serve'.
# If you change this file, please restart the server process.

# Site settings
# are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

theme: jekyll-agency

url    : "https://bolatogluyapi.com" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "" # the subpath of your site, e.g. /blog

title      : Bolatoğlu Yapı
email      : bolatogluyapi@gmail.com #this is also the email contact forms will go to
# tagline: arama sonucunda basligin ikinci yarisini olusturur, kisa tutulmali.
# tanimli degilse jekyll-seo-tag description'i basliga koyar ve baslik cok uzar.
tagline    : "Erbaa PVC Pencere, Cam Balkon ve Tadilat"
description: "Yılların Erbaa Pimapen tecrübesi, şimdi Bolatoğlu Yapı güvencesiyle. PVC pencere, cam balkon, duşakabin ve tadilat işlerinizde estetik ve sağlam çözümler."
author     : Bolatoğlu Yapı
# logo:     #optional, defaults to site title
  # path: assets\img\clients\creative-market.jpg
  # height: 60 #height in px, defaults to 52px
tema_logo:
  path: "assets/img/logo1.png"
  #height: 80

locale: "tr-TR" # See available languages in _data/sitetext.yml

analytics:
  google: G-D3NNRRYBZK

collections:
  portfolio:
    output: true
    permalink: /islerim/:name/
  hizmetler:
    output: true
    permalink: /hizmetler/:name/

defaults:
  # WhatsApp/Instagram/Facebook'ta link paylasilinca gorunen onizleme gorseli.
  # Kendi "image" alani olan sayfalar (projeler) bundan etkilenmez, kendi gorselini kullanir.
  - scope:
      path: ""
    values:
      image: /assets/img/og-image.jpg
  - scope:
      path: ""
      type: portfolio
    values:
      layout: project
  - scope:
      path: ""
      type: hizmetler
    values:
      layout: service
      # hizmet sayfalari blog yazisi degil; seo-tag varsayilanini duzelt
      seo:
        type: WebPage

markdown: kramdown

# Uncomment following line to use Formspree form ID based URL instead of email based URL
# Details: https://help.formspree.io/hc/en-us/articles/360017735154-How-to-prevent-spam
formspree_form_path: "f/mblnyzvg"
# Yayina dahil edilmeyecek dosyalar
exclude:
  - YENI-IS-EKLEME.md
  - vendor
  - Gemfile
  - Gemfile.lock

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap